<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Calendar - High Performance</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(20, 25, 40, 0.8);
            --accent-cyan: #00f0ff;
            --accent-purple: #8a2be2;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(138, 43, 226, 0.05), transparent 25%);
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--panel-bg);
            border-right: 1px solid rgba(0, 240, 255, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-bottom: 20px;
        }

        button {
            background: transparent;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-purple {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }
        .btn-purple:hover {
            background: var(--accent-purple);
            color: white;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
        }

        .file-upload-wrapper {
            position: relative;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Main Calendar Area */
        .main-content {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Timeline Grid */
        .timeline {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 15px;
            flex: 1;
        }

        .time-label {
            color: var(--text-muted);
            text-align: right;
            padding-top: 15px;
            font-size: 0.9rem;
            border-right: 2px solid rgba(255, 255, 255, 0.05);
            padding-right: 15px;
        }

        .slot {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            min-height: 60px;
            padding: 15px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .slot:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .task {
            font-size: 1rem;
            font-weight: 500;
        }

        /* Task Types */
        .type-work { border-left: 4px solid var(--accent-cyan); }
        .type-eat { border-left: 4px solid #ffaa00; background: rgba(255, 170, 0, 0.05); }
        .type-rest { border-left: 4px solid var(--accent-purple); background: rgba(138, 43, 226, 0.05); }
        
        .status-msg {
            color: #10b981;
            font-size: 0.85rem;
            margin-top: 10px;
            height: 20px;
        }

        /* Modal for adding custom tasks */
        .add-task-container {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed rgba(0, 240, 255, 0.3);
        }
        .add-task-container input {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

    </style>
</head>
<body>

    <!-- Panel Lateral -->
    <div class="sidebar">
        <div class="logo">O.S. Calendar</div>
        
        <button id="btnVoice" onclick="startDictation()">
            🎤 Añadir por Voz
        </button>
        
        <div class="file-upload-wrapper">
            <button>📁 Cargar Archivo (.TXT)</button>
            <input type="file" id="fileUpload" accept=".txt,.json" onchange="handleFileUpload(event)">
        </div>

        <button class="btn-purple" onclick="generatePerfectRoutine()">
            ⚡ Generar Rutina Óptima (24h)
        </button>

        <div class="status-msg" id="statusMsg"></div>

        <div class="add-task-container">
            <h4 style="margin-bottom: 10px; color: var(--accent-cyan); font-size: 0.9rem;">Entrada Manual / Voz</h4>
            <input type="text" id="manualTask" placeholder="Ej: 14:00 Reunión">
            <button onclick="addManualTask()" style="width: 100%; padding: 8px;">Añadir</button>
        </div>
        
        <div style="margin-top: auto; font-size: 0.8rem; color: var(--text-muted);">
            <p><strong>Info de Rendimiento:</strong></p>
            <p>Para estar activo toda la semana, el sistema programa 8h de sueño y 3 comidas estratégicas. Respétalas.</p>
        </div>
    </div>

    <!-- Calendario Principal -->
    <div class="main-content">
        <div class="header">
            <h2>Mi agenda diaria: <span id="currentDate" style="color: var(--accent-cyan);"></span></h2>
            <button onclick="clearCalendar()" style="border: 1px solid #ef4444; color: #ef4444;">Limpiar Agenda</button>
        </div>
        
        <div class="timeline" id="timelineGrid">
            <!-- Las horas se generan por JavaScript -->
        </div>
    </div>

    <script>
        // Set current date
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('es-ES', options).toUpperCase();

        // Inicializar Grid de 24 horas
        const timelineGrid = document.getElementById('timelineGrid');
        
        function initGrid() {
            timelineGrid.innerHTML = '';
            for (let i = 0; i < 24; i++) {
                let hour = i < 10 ? `0${i}:00` : `${i}:00`;
                timelineGrid.innerHTML += `
                    <div class="time-label">${hour}</div>
                    <div class="slot" id="slot-${i}">
                        <span class="task" style="color: var(--text-muted)">-- Libre --</span>
                    </div>
                `;
            }
        }
        initGrid();

        function showStatus(msg) {
            const status = document.getElementById('statusMsg');
            status.innerText = msg;
            setTimeout(() => status.innerText = '', 3000);
        }

        // 1. Añadir Tarea al DOM
        function addTaskToSlot(hour, taskText, typeClass = 'type-work') {
            const slot = document.getElementById(`slot-${hour}`);
            if (slot) {
                slot.className = `slot ${typeClass}`;
                slot.innerHTML = `<span class="task">${taskText}</span>`;
            }
        }

        // 2. Dictado por Voz (Web Speech API)
        function startDictation() {
            if (window.hasOwnProperty('webkitSpeechRecognition')) {
                const recognition = new webkitSpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = "es-ES";
                
                showStatus("Escuchando... Habla ahora.");
                recognition.start();

                recognition.onresult = function(e) {
                    const transcript = e.results[0][0].transcript;
                    document.getElementById('manualTask').value = transcript;
                    showStatus("Texto capturado por voz.");
                    recognition.stop();
                };

                recognition.onerror = function(e) {
                    showStatus("Error en el micrófono.");
                    recognition.stop();
                };
            } else {
                alert("Tu navegador no soporta el dictado por voz. Usa Google Chrome.");
            }
        }

        // 3. Añadir tarea manual o dictada
        function addManualTask() {
            const input = document.getElementById('manualTask').value;
            // Parseo básico: busca un número al principio para la hora (Ej: "14 reunión" o "14:00 reunión")
            const match = input.match(/(\d{1,2})(:00)?\s+(.*)/);
            if (match) {
                let hour = parseInt(match[1]);
                let task = match[3];
                if(hour >= 0 && hour < 24) {
                    addTaskToSlot(hour, task, 'type-work');
                    document.getElementById('manualTask').value = '';
                    showStatus("Tarea añadida.");
                }
            } else {
                alert("Formato incorrecto. Escribe la hora y la tarea. Ej: '14 Reunion con equipo'");
            }
        }

        // 4. Leer archivo de texto (.txt)
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                lines.forEach(line => {
                    // Espera formato: "14:00 - Tarea"
                    const match = line.match(/(\d{1,2}):\d{2}\s*-\s*(.*)/);
                    if (match) {
                        addTaskToSlot(parseInt(match[1]), match[2]);
                    }
                });
                showStatus("Archivo transvasado con éxito.");
            };
            reader.readAsText(file);
        }

        function clearCalendar() {
            initGrid();
            showStatus("Agenda limpiada.");
        }

        // 5. El Algoritmo de Rutina de Alto Rendimiento
        function generatePerfectRoutine() {
            initGrid();
            const routine = [
                // Descanso Biológico (8 horas)
                {h: 22, t: "💤 Inicio de Descanso Profundo", c: "type-rest"},
                {h: 23, t: "💤 Sueño Reparador", c: "type-rest"},
                {h: 0, t: "💤 Sueño Reparador", c: "type-rest"},
                {h: 1, t: "💤 Sueño Reparador", c: "type-rest"},
                {h: 2, t: "💤 Sueño Reparador", c: "type-rest"},
                {h: 3, t: "💤 Sueño Reparador", c: "type-rest"},
                {h: 4, t: "💤 Sueño Reparador", c: "type-rest"},
                {h: 5, t: "💤 Sueño Reparador", c: "type-rest"},
                
                // Mañana - Activación
                {h: 6, t: "🏃‍♂️ Ejercicio / Activación Cardiovascular", c: "type-work"},
                {h: 7, t: "🍳 Desayuno (Proteínas y Grasas saludables) + Ducha", c: "type-eat"},
                
                // Trabajo Profundo - Bloque 1
                {h: 8, t: "🧠 Trabajo Profundo (Enfoque máximo - Sin distracciones)", c: "type-work"},
                {h: 9, t: "🧠 Trabajo Profundo", c: "type-work"},
                {h: 10, t: "☕ Descanso Activo (20 min) / Trabajo ligero", c: "type-work"},
                {h: 11, t: "🧠 Trabajo Profundo", c: "type-work"},
                
                // Medio día - Recarga
                {h: 12, t: "🥗 Almuerzo (Evitar exceso de carbohidratos para no dar sueño)", c: "type-eat"},
                {h: 13, t: "🚶‍♂️ Paseo ligero / Siesta corta (20 min max)", c: "type-rest"},
                
                // Trabajo Bloque 2
                {h: 14, t: "💻 Reuniones / Trabajo Colaborativo", c: "type-work"},
                {h: 15, t: "💻 Gestión de correos / Tareas secundarias", c: "type-work"},
                {h: 16, t: "☕ Snack saludable + Descanso (20 min)", c: "type-eat"},
                {h: 17, t: "🧠 Trabajo Profundo - Último sprint", c: "type-work"},
                {h: 18, t: "📊 Planificación del día siguiente", c: "type-work"},
                
                // Noche - Desconexión
                {h: 19, t: "🍽️ Cena Ligera", c: "type-eat"},
                {h: 20, t: "📚 Ocio / Lectura / Desarrollo Personal", c: "type-rest"},
                {h: 21, t: "📵 Apagar pantallas / Meditación / Relajación", c: "type-rest"}
            ];

            routine.forEach(item => {
                addTaskToSlot(item.h, item.t, item.c);
            });
            
            showStatus("Rutina de Alto Rendimiento Aplicada.");
        }
    </script>
</body>
</html>
